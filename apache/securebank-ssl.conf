# SecureBank SSL Virtual Host Configuration
# Deployed on Ubuntu Server 192.168.100.20
# Implements HSTS to neutralise SSL stripping attacks

<VirtualHost *:443>
    ServerName securebank.local
    SSLEngine On
    SSLCertificateFile /etc/ssl/certs/securebank.crt
    SSLCertificateKeyFile /etc/ssl/private/securebank.key

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"

    # Reverse proxy to Flask app on port 5000
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>

# Redirect all HTTP to HTTPS
<VirtualHost *:80>
    ServerName securebank.local
    Redirect permanent / https://192.168.100.20/
</VirtualHost>